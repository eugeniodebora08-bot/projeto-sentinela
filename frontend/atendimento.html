<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Atendimento</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h2>Atendimento</h2>

    <input id="nome" placeholder="Nome">
    <input id="cpf" placeholder="CPF">

    <input id="dataNascimento" type="date">

    <input id="sexo" placeholder="Sexo">

    <input id="nomeMae" placeholder="Nome da mãe">

    <input id="estadoCivil" placeholder="Estado civil">

    <input id="endereco" placeholder="Endereço">

    <input id="telefone" placeholder="Telefone">

    <input id="email" type="email" placeholder="E-mail">

    <input id="contatoEmergencia" placeholder="Contato de emergência">

    <select id="tipo">
        <option value="Convenio">Convênio</option>
        <option value="Particular">Particular</option>
    </select>

    <button onclick="cadastrar()">Cadastrar</button>

</div>

<script>

async function cadastrar() {

    const dados = {
        nome: document.getElementById("nome").value,
        cpf: document.getElementById("cpf").value,
        datadenascimento: document.getElementById("dataNascimento").value,
        sexo: document.getElementById("sexo").value,
        nomedamae: document.getElementById("nomeMae").value,
        estadocivil: document.getElementById("estadoCivil").value,
        endereco: document.getElementById("endereco").value,
        telefone: document.getElementById("telefone").value,
        email: document.getElementById("email").value,
        contatodeemergencia: document.getElementById("contatoEmergencia").value,
        tipo: document.getElementById("tipo").value
    };

    if (!dados.nome) {
        alert("Digite o nome do paciente.");
        return;
    }

    try {

        const resposta = await fetch("/atendimento", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(dados)

        });

        const resultado = await resposta.json();

        if (!resposta.ok) {

            alert("Erro: " + resultado.erro);
            return;

        }

        alert("Paciente cadastrado e enviado para triagem!");

        document.getElementById("nome").value = "";
        document.getElementById("cpf").value = "";
        document.getElementById("dataNascimento").value = "";
        document.getElementById("sexo").value = "";
        document.getElementById("nomeMae").value = "";
        document.getElementById("estadoCivil").value = "";
        document.getElementById("endereco").value = "";
        document.getElementById("telefone").value = "";
        document.getElementById("email").value = "";
        document.getElementById("contatoEmergencia").value = "";

    } catch (erro) {

        console.error(erro);

        alert("Servidor não está rodando.");

    }

}

</script>

</body>

</html>
