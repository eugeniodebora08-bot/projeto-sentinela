<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eugenio Hospitalar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f8fb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 350px;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo {
            width: 120px;
            height: auto;
        }

        h1 {
            margin-bottom: 10px;
            color: #003366;
        }

        p {
            color: #666666;
            margin-bottom: 25px;
        }

        .campo {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #008b8b;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="logo-container">
            <img src="ChatGPT Image 7 de ago. de 2026, 12_14_09.png" alt="Logo Eugenio Hospitalar" class="logo">
        </div>

        <h1>Eugenio Hospitalar</h1>

        <p>Entre com suas credenciais para continuar</p>

        <input class="campo" id="usuario" placeholder="Usuário">

        <input
            class="campo"
            id="senha"
            type="password"
            placeholder="Senha"
        >

        <button onclick="login()">Entrar</button>
    </div>

    <script>
        function login() {
      fetch("/login, {
 method: "POST",
headers: {"Content-type": "application/json"},
        body JSON.stringify({
        usuario: usuario.value,
            senha: senha.value
        })
        })
.then( r => r.json())
.then( data => {
    if( data.tipo "triagem") location.href = "triagem.html";
    if (data.tipo "medico" ) location.href = "medico.html";
    if( data.tipo "atendimento") location.href =
        "atendimento.html";
});
        }
    </script>
</body>
</html>
